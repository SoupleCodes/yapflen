<div class="post-container">
    <div class="post-user-info-container">
      <div class="post-user-icon-container">
        <img src />
      </div>
      <div class="post-user-info">
        <a class="post-user-displayname-container">
          <span class="post-user-displayname"></span>
        </a>
        <small class="post-user-time"></small>
      </div>
      <div class="post-more-icon"></div>
    </div>

    <div class="post-message-container">
    </div>

    <div class="post-poll">
      <small class="post-poll-info"></small>
    </div>

    <div class="post-attachment">
    </div>

    <div class="post-image-slider">
      <div class="post-image-slider-wrapper">
        <ul></ul>
      </div>
      <div class="prev">&lt;</div>
      <div class="next">&gt;</div>
      <div class="pagination"></div>
    </div>

    <div class="post-repost"></div>
    
    <div class="post-user-actions-container">
      <div class="loves post-action">
        <img src="/images/love_icon.png">
        <small></small>
      </div>

      <div class="reposts post-action">
        <img src="/images/repost_icon.png">
      </div>
    </div>

    <div class="post-reply-area-wrapper thin">
      <div class="post-reply-area">
        <div class="comment-reply-wrapper">
          <div class="comment-user-icon-container">
            <img src="/images/default.png">
          </div>

          <div class="column grow">
            <textarea></textarea>
            <div style="margin: 8px 0px;">
              <button class="submit">Post</button><button class="cancel">Cancel</button>
            </div>
          </div>

        </div>

        <div class="comments"></div>

        <textarea placeholder="Add a comment..." class="post-actions-textarea hidden"></textarea>
      </div>
    </div>
</div>
